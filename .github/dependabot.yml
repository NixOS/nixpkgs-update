version: 2
updates:
  - package-ecosystem: "github-actions"
    cooldown:
      default-days: 7
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "nix"
    cooldown:
      default-days: 7
    directory: "/"
    schedule:
      # Run a bit after each nixpkgs release (on the 1st of January and July)
      interval: "semiannually"
